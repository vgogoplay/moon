<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全與登入日誌 🛡️ 月老神社後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20261115">
</head>
<body data-admin-page="logs">
    <div id="adminLayoutMount" class="space-y-6">
        <!-- 新增：玩家配對成功日誌（保留最近 30 筆） -->
        <div class="card-jp rounded-2xl overflow-hidden border-2 border-pink-200">
            <div class="p-5 border-b border-pink-200 flex flex-wrap items-center justify-between bg-pink-50/50 gap-3">
                <div>
                    <div class="flex flex-wrap items-center gap-2">
                        <h2 class="text-lg font-bold font-serif-jp text-[#8f4452]">💘 玩家配對成功日誌</h2>
                        <span id="matchLogsCountBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-pink-100 text-[#8f4452] font-bold">
                            近 0 / 30 筆
                        </span>
                    </div>
                    <p class="text-xs text-gray-500 mt-0.5">每次 A 與 B 配對成功後自動紀錄雙方玩家與配對時間，保留最近 30 筆紀錄</p>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="clearAdminMatchLogs()" class="text-xs px-3 py-2 rounded-xl bg-white border border-pink-300 text-[#8f4452] font-bold hover:bg-pink-50 transition shadow-sm">
                        🗑️ 清空配對日誌
                    </button>
                    <button type="button" onclick="renderAdminAll(true)" class="text-xs px-3.5 py-2 rounded-xl bg-white border border-pink-300 text-[#8f4452] font-semibold hover:bg-pink-50 transition shadow-sm">
                        ↻ 重新整理
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto p-3 bg-white">
                <table class="admin-grid-table text-left text-xs md:text-sm">
                    <thead>
                        <tr class="text-xs">
                            <th class="p-3.5 w-44">配對時間</th>
                            <th class="p-3.5">配對玩家 A</th>
                            <th class="p-3.5">配對玩家 B</th>
                            <th class="p-3.5">配對場次 / 來源</th>
                        </tr>
                    </thead>
                    <tbody id="matchLogsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 登入失敗日誌清單 -->
        <div class="card-jp rounded-2xl overflow-hidden border-2 border-rose-200">
            <div class="p-5 border-b border-rose-200 flex flex-wrap items-center justify-between bg-rose-50/40 gap-3">
                <div>
                    <h2 class="text-lg font-bold font-serif-jp text-rose-800">🛡️ 後台防護與玩家操作日誌</h2>
                    <p class="text-xs text-gray-500 mt-0.5">系統自動記錄登入失敗的來源 IP，以及前台玩家手動解除配對的操作紀錄（保留最近 10 筆）</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearAdminLoginLogs()" class="text-xs px-3 py-2 rounded-xl bg-white border border-rose-300 text-rose-700 font-bold hover:bg-rose-50 transition shadow-sm">
                        🗑️ 清空所有紀錄
                    </button>
                    <button onclick="renderAdminAll()" class="text-xs px-3.5 py-2 rounded-xl bg-white border border-pink-300 text-[#8f4452] font-semibold hover:bg-pink-50 transition shadow-sm">
                        ↻ 重新整理
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto p-3 bg-white">
                <table class="admin-grid-table text-left text-xs md:text-sm">
                    <thead>
                        <tr class="text-xs">
                            <th class="p-3.5">時間</th>
                            <th class="p-3.5 w-48">操作類型 / 嘗試帳號</th>
                            <th class="p-3.5 w-40">來源 IP / 玩家名稱</th>
                            <th class="p-3.5">詳細內容 / 裝置資訊</th>
                        </tr>
                    </thead>
                    <tbody id="loginLogsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 前後台共用核心層 -->
    <script src="shared/schedule.js?v=20261116e"></script>
    <script src="shared/schema.js?v=20261115l"></script>
    <script src="shared/cloud-store.js?v=20261116l"></script>
    <!-- 後台共用狀態與頁面模組 -->
    <script src="backend/state.js?v=20261116d"></script>
    <script src="backend/matching.js?v=20261116h"></script>
    <script src="backend/logs.js?v=20261116c"></script>
    <!-- 渲染左側選單與登入驗證 -->
    <script src="backend/layout.js?v=20261116c"></script>
</body>
</html>
