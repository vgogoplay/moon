<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家聊天紀錄查詢 💬 月老神社後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20261118b">
</head>
<body data-admin-page="chats">
    <div id="adminLayoutMount" class="space-y-6">
        <!-- 頂部標題與搜尋控制列 -->
        <div class="card-jp rounded-2xl p-5 border-2 border-pink-200 space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
                <div>
                    <div class="flex flex-wrap items-center gap-2">
                        <h2 class="text-lg font-bold font-serif-jp text-[#8f4452]">💬 玩家聊天紀錄查詢</h2>
                        <span id="chatRoomsSummaryBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-pink-100 text-[#8f4452] font-bold">
                            聊天室 0 間 ／ 訊息 0 則
                        </span>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">點選左側配對聊天室展開對話紀錄；若聊天室超過 <strong>3 天</strong>無更新或無新訊息，系統將每日自動檢查一次並刪除聊天紀錄（不保存）及解除會員列表雙方好友配對</p>
                </div>

                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <div class="admin-field-box !py-1.5 !px-3 flex items-center gap-2">
                        <span class="text-[#8f4452] font-bold shrink-0">🔍 搜尋：</span>
                        <input type="text" id="adminChatSearchInput" oninput="onAdminChatSearchInput(this.value)" placeholder="輸入玩家 ID、暱稱或關鍵字..." class="w-48 sm:w-60 p-1.5 admin-input-box text-xs">
                        <button type="button" id="clearAdminChatSearchBtn" onclick="clearAdminChatSearch()" class="hidden text-gray-400 hover:text-rose-600 font-bold px-1">✕</button>
                    </div>
                    <button type="button" onclick="renderAdminAll(true)" class="px-3.5 py-2.5 rounded-xl bg-white border border-pink-300 text-[#8f4452] font-semibold hover:bg-pink-50 transition">
                        ↻ 重新整理
                    </button>
                </div>
            </div>
        </div>

        <!-- 雙欄式聊天室查詢工作區（左側房間列表 ／ 右側對話內容） -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <!-- 左側：配對聊天房間列表（每頁 10 間） -->
            <div class="lg:col-span-5 card-jp rounded-2xl border-2 border-pink-200 overflow-hidden">
                <div class="px-4 py-3 bg-pink-50/70 border-b border-pink-200 flex items-center justify-between">
                    <span class="text-xs font-bold text-[#8f4452]">💞 配對聊天室列表（每頁 10 間）</span>
                    <span id="filteredChatRoomsCountText" class="text-[11px] text-gray-500">共 0 間</span>
                </div>
                <div id="adminChatRoomsList" class="divide-y divide-pink-100 bg-white"></div>
                <div id="adminChatRoomsPaginationBar" class="px-3.5 py-2.5 bg-pink-50/50 border-t border-pink-200 flex flex-wrap items-center justify-between gap-2 text-[11px]"></div>
            </div>

            <!-- 右側：選中房間的對話紀錄明細 -->
            <div class="lg:col-span-7 card-jp rounded-2xl border-2 border-pink-200 overflow-hidden bg-white">
                <div id="adminChatDetailHeader" class="px-5 py-3.5 bg-gradient-to-r from-pink-50/80 to-rose-50/60 border-b border-pink-200 flex flex-wrap items-center justify-between gap-2">
                    <div>
                        <h3 class="text-sm font-bold text-[#8f4452]">對話內容檢視視窗</h3>
                        <p class="text-[11px] text-gray-400">請從左側點選任一組配對查看對話紀錄</p>
                    </div>
                </div>
                <div id="adminChatDetailMessages" class="p-4 bg-[#fffafb] min-h-[420px] max-h-[540px] overflow-y-auto space-y-2.5">
                    <div class="h-80 flex flex-col items-center justify-center text-center text-xs text-gray-400 space-y-2">
                        <span class="text-3xl">💌</span>
                        <p>點選左側配對聊天室後，將在此顯示雙方的對話紀錄</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 前後台共用核心層 -->
    <script src="shared/schedule.js?v=20261118f"></script>
    <script src="shared/schema.js?v=20261117a"></script>
    <script src="shared/cloud-store.js?v=20261118f"></script>
    <!-- 後台共用狀態與頁面模組 -->
    <script src="backend/state.js?v=20261118l"></script>
    <script src="backend/matching.js?v=20261118f"></script>
    <script src="backend/chats.js?v=20261118b"></script>
    <!-- 渲染左側選單與登入驗證 -->
    <script src="backend/layout.js?v=20261118m"></script>
</body>
</html>
